<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Insight Grid</title>
    <style>
        :root {
            --bg: #f4f7f6;
            --card: #ffffff;
            --text: #333;
            --primary: #4f46e5;
            --grid-gap: 16px;
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #111827;
                --card: #1f2937;
                --text: #f9fafb;
                --primary: #6366f1;
            }
        }
        body { margin: 0; padding: 16px; font-family: 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: var(--grid-gap); }
        .card { background: var(--card); border-radius: 12px; padding: 16px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }
        .card-title { font-size: 0.8rem; font-weight: 600; opacity: 0.7; margin-bottom: 8px; text-transform: uppercase; }
        .big-val { font-size: 1.5rem; font-weight: 800; color: var(--primary); }

        .full-width { grid-column: 1 / -1; }
        input, button { width: 100%; box-sizing: border-box; padding: 10px; border-radius: 6px; border: 1px solid #ccc; margin-top: 8px; }
        button { background: var(--primary); color: white; border: none; font-weight: bold; cursor: pointer; }

        .hidden { display: none !important; }
        #login-overlay { position: fixed; inset: 0; background: var(--bg); z-index: 1000; padding: 40px; display: flex; flex-direction: column; align-items: center; justify-content: center; }
    </style>
</head>
<body>
    <div id="login-overlay">
        <h2>🛡️ Insight</h2>
        <input type="password" id="pin-input" placeholder="PIN">
        <button id="login-btn">Unlock</button>
    </div>

    <div id="main-content" class="hidden">
        <h1 style="margin-bottom: 24px;">Insights</h1>
        <div class="grid">
            <div class="card">
                <div class="card-title">Usage</div>
                <div class="big-val"><span id="usage">0</span>m</div>
            </div>
            <div class="card">
                <div class="card-title">Remaining</div>
                <div class="big-val"><span id="remaining">0</span>m</div>
            </div>

            <div class="card full-width">
                <div class="card-title">Configuration</div>
                <label>Daily Quota</label>
                <input type="number" id="dailyQuota">
                <div style="display:flex; gap:8px; margin-top:8px;">
                    <div style="flex:1"><label>Start</label><input type="time" id="offStart"></div>
                    <div style="flex:1"><label>End</label><input type="time" id="offEnd"></div>
                </div>
                <button id="save-settings" style="margin-top:16px;">Update Grid</button>
            </div>

            <div class="card full-width">
                <div class="card-title">Activity Feed</div>
                <div id="log-list" style="max-height: 200px; overflow-y: auto; font-size: 0.8rem;"></div>
            </div>
        </div>
    </div>
    <script src="options.js"></script>
</body>
</html>
