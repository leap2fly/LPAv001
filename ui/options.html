<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control Center</title>
    <style>
        :root {
            --bg: #f2f2f7;
            --card: #ffffff;
            --text: #000000;
            --muted: #8e8e93;
            --accent: #007aff;
            --separator: #c6c6c8;
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #000000;
                --card: #1c1c1e;
                --text: #ffffff;
                --muted: #8e8e93;
                --accent: #0a84ff;
                --separator: #38383a;
            }
        }
        body { margin: 0; font-family: -apple-system, sans-serif; background: var(--bg); color: var(--text); padding: 20px; }
        .section-title { font-size: 0.8rem; text-transform: uppercase; color: var(--muted); margin: 20px 0 8px 16px; }
        .group { background: var(--card); border-radius: 10px; overflow: hidden; margin-bottom: 20px; }
        .row { display: flex; align-items: center; padding: 12px 16px; gap: 12px; border-bottom: 0.5px solid var(--separator); }
        .row:last-child { border-bottom: none; }
        .row-label { flex: 1; font-size: 1rem; }
        .row-value { color: var(--muted); font-size: 1rem; }

        input, button { font-size: 1rem; padding: 8px; border-radius: 8px; border: none; background: var(--bg); color: var(--text); }
        .btn { background: var(--accent); color: white; width: 100%; font-weight: 600; padding: 12px; margin-top: 10px; cursor: pointer; }

        .hidden { display: none !important; }
        #login-overlay { position: fixed; inset: 0; background: var(--bg); z-index: 1000; display: flex; flex-direction: column; align-items: center; justify-content: center; }
    </style>
</head>
<body>
    <div id="login-overlay">
        <h1>Control Center</h1>
        <p>Enter Passcode</p>
        <input type="password" id="pin-input" style="width: 150px; text-align: center;">
        <button id="login-btn" class="btn" style="width: 150px;">Enter</button>
    </div>

    <div id="main-content" class="hidden">
        <h1 style="margin-left: 16px;">Settings</h1>

        <div class="section-title">Screen Time</div>
        <div class="group">
            <div class="row">
                <span class="row-label">Usage Today</span>
                <span class="row-value"><span id="usage">0</span>m</span>
            </div>
            <div class="row">
                <span class="row-label">Daily Limit</span>
                <input type="number" id="dailyQuota" style="width: 60px; text-align: right;">
            </div>
        </div>

        <div class="section-title">Web Filtering</div>
        <div class="group">
            <div class="row" style="flex-direction: column; align-items: flex-start;">
                <span class="row-label">Blocked Sites</span>
                <div id="url-list" style="width: 100%; font-size: 0.9rem; margin-top: 8px;"></div>
                <div style="display:flex; width: 100%; gap: 8px; margin-top: 8px;">
                    <input type="text" id="url-input" placeholder="Add domain..." style="flex:1">
                    <button id="add-url" style="color: var(--accent); font-weight: 600;">Add</button>
                </div>
            </div>
        </div>

        <div class="section-title">Schedule</div>
        <div class="group">
            <div class="row">
                <span class="row-label">Start Sleep</span>
                <input type="time" id="offStart">
            </div>
            <div class="row">
                <span class="row-label">End Sleep</span>
                <input type="time" id="offEnd">
            </div>
        </div>

        <button id="save-all" class="btn">Save Configuration</button>
    </div>

    <script src="options.js"></script>
</body>
</html>
