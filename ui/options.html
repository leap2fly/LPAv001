<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Safety Feed - Dashboard</title>
    <style>
        :root {
            --bg-color: #f0f2f5;
            --card-bg: #ffffff;
            --text-color: #1c1e21;
            --text-muted: #65676b;
            --primary-color: #0084ff;
            --danger-color: #fa383e;
            --success-color: #42b72a;
            --border-color: #dddfe2;
            --nav-bg: #ffffff;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg-color: #18191a;
                --card-bg: #242526;
                --text-color: #e4e6eb;
                --text-muted: #b0b3b8;
                --primary-color: #2d88ff;
                --danger-color: #f35359;
                --success-color: #45bd62;
                --border-color: #3e4042;
                --nav-bg: #242526;
            }
        }

        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        /* Top Bar */
        .top-bar {
            height: 56px;
            background-color: var(--nav-bg);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            padding: 0 16px;
            font-weight: bold;
            font-size: 1.2rem;
            flex-shrink: 0;
        }

        /* Content Scroll Area */
        .feed-container {
            flex: 1;
            overflow-y: auto;
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            padding-bottom: 80px; /* Space for bottom nav */
        }

        .card {
            background-color: var(--card-bg);
            border-radius: 8px;
            padding: 16px;
            box-shadow: 0 1px 2px rgba(0,0,0,0.1);
        }

        .card-header {
            font-weight: bold;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        /* Status Ring */
        .status-hub {
            text-align: center;
            padding: 24px 0;
        }

        .progress-ring {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            border: 8px solid var(--border-color);
            border-top-color: var(--primary-color);
            margin: 0 auto 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-weight: bold;
        }

        /* Lists */
        .feed-item {
            padding: 12px 0;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .feed-item:last-child { border-bottom: none; }
        .feed-item-title { font-size: 0.9rem; font-weight: 500; }
        .feed-item-meta { font-size: 0.8rem; color: var(--text-muted); }

        /* Bottom Nav */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            width: 100%;
            height: 64px;
            background-color: var(--nav-bg);
            border-top: 1px solid var(--border-color);
            display: flex;
            justify-content: space-around;
            align-items: center;
            z-index: 100;
        }

        .nav-btn {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            font-size: 0.7rem;
            color: var(--text-muted);
            cursor: pointer;
            flex: 1;
        }

        .nav-btn.active { color: var(--primary-color); }
        .nav-btn span { font-size: 1.4rem; }

        /* Form Elements */
        input {
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 10px;
            border-radius: 4px;
            width: 100%;
            box-sizing: border-box;
        }
        button {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
        }

        .hidden { display: none !important; }

        /* Login Overlay */
        #login-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: var(--bg-color); z-index: 1000;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            padding: 24px;
        }
    </style>
</head>
<body>
    <div id="login-overlay">
        <h2>🛡️ Safety Feed</h2>
        <p>Unlock with Master PIN</p>
        <input type="password" id="pin-input" style="width: 200px; text-align: center; font-size: 2rem;">
        <button id="login-btn" style="width: 200px; margin-top: 20px;">Unlock</button>
    </div>

    <div class="top-bar">🛡️ PC-Safety Feed</div>

    <div class="feed-container hidden" id="main-content">
        <!-- Home Tab -->
        <section id="tab-home" class="tab-content">
            <div class="card status-hub">
                <div class="progress-ring">
                    <div style="font-size: 1.5rem;"><span id="remaining-display">∞</span></div>
                    <div style="font-size: 0.7rem; color: var(--text-muted);">Remaining</div>
                </div>
                <div id="status-badge" style="color: var(--success-color); font-weight: bold;">ACTIVE PROTECTION</div>
            </div>

            <div class="card">
                <div class="card-header">Recent Activity</div>
                <div id="log-feed">
                    <!-- Logs go here as feed items -->
                </div>
            </div>
        </section>

        <!-- Rules Tab -->
        <section id="tab-rules" class="tab-content hidden">
            <div class="card">
                <div class="card-header">Website Rules</div>
                <input type="text" id="url-input" placeholder="Block a site...">
                <button id="add-url" style="margin-top: 8px; width: 100%;">Add Block</button>
                <div id="url-list" style="margin-top: 12px;"></div>
            </div>
            <div class="card">
                <div class="card-header">Keywords</div>
                <input type="text" id="keyword-input" placeholder="Restrict word...">
                <button id="add-keyword" style="margin-top: 8px; width: 100%;">Add Word</button>
                <div id="keyword-list" style="margin-top: 12px;"></div>
            </div>
        </section>

        <!-- Time Tab -->
        <section id="tab-time" class="tab-content hidden">
            <div class="card">
                <div class="card-header">Daily Quota (Min)</div>
                <input type="number" id="dailyQuota">
            </div>
            <div class="card">
                <div class="card-header">Bedtime (Off-Hours)</div>
                <div style="display: flex; gap: 8px;">
                    <input type="time" id="offStart">
                    <input type="time" id="offEnd">
                </div>
            </div>
            <button id="save-time" style="width: 100%;">Save Changes</button>
        </section>
    </div>

    <nav class="bottom-nav hidden" id="nav-bar">
        <div class="nav-btn active" data-tab="tab-home"><span>🏠</span>Home</div>
        <div class="nav-btn" data-tab="tab-rules"><span>🛡️</span>Rules</div>
        <div class="nav-btn" data-tab="tab-time"><span>⏱️</span>Time</div>
        <div class="nav-btn" id="open-settings-full"><span>⚙️</span>More</div>
    </nav>

    <script src="options.js"></script>
</body>
</html>
